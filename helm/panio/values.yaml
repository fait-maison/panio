replicaCount: 1

image:
  repository: ghcr.io/fait-maison/panio
  pullPolicy: IfNotPresent
  # Overrides the image tag. Defaults to the chart's appVersion.
  tag: ''

imagePullSecrets: []

nameOverride: ''
fullnameOverride: ''

service:
  type: ClusterIP
  port: 80

# The image runs nginx-unprivileged as uid 101 on port 8080.
# These defaults pass the Pod Security "restricted" profile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

ingress:
  enabled: false
  className: ''
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: panio.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: panio-tls
  #    hosts:
  #      - panio.local

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
